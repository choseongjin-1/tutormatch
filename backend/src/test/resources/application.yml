spring:
  application:
    name: tutormatch-backend-test
  datasource:
    url: jdbc:h2:mem:tutormatch-test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: tutormatch-test-secret-key-not-for-production-use-0123456789
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000
